
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Student Management</h1>
            <p>Manage your students in one place</p>
        </header>

        <section class="form-section">
            <h2>Add New Student</h2>

            <form id="studentForm">
                <input type="text" id="name" placeholder="Enter student name" required>
                <input type="text" id="course" placeholder="Enter course name" required>
                <button type="submit">Add Student</button>
            </form>
        </section>

        <section class="table-section">
            <h2>Student List</h2>

            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Course</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentList"></tbody>
            </table>
        </section>

    </div>

    <div class="modal hidden" id="editModal">
        <div class="modal-box">
            <h2>Edit Student</h2>

            <form id="editForm">
                <input type="text" id="editName" placeholder="Student name" required>
                <input type="text" id="editCourse" placeholder="Course name" required>

                <div class="modal-actions">
                    <button type="button" id="cancelEdit" class="cancel-btn">Cancel</button>
                    <button type="submit" class="confirm-btn">Update</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal hidden" id="deleteModal">
        <div class="modal-box">
            <h2>Delete Student?</h2>
            <p>Are you sure you want to delete this student?</p>

            <div class="modal-actions">
                <button type="button" id="cancelDelete" class="cancel-btn">Cancel</button>
                <button type="button" id="confirmDelete" class="confirm-btn">Yes, Delete</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="script.js"></script>

</body>
</html>
